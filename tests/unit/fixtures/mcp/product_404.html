    <!-- ===== MOBILE & PWA OPTIMIZATIONS ===== -->

    <!-- Responsive viewport with mobile-friendly settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- PWA: Make app installable on mobile devices -->
    <meta name="theme-color" content="#3b4a2a" />
    <meta name="description" content="Specodex indexes industrial electromechanical specs — servo motors, drives, gearheads, contactors, electric cylinders, robot arms — across vendors. Filter by the number you need and go straight to the datasheet that produced it. No quote gates." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.specodex.com/" />

    <!-- iOS PWA: Enable standalone mode (hides Safari UI) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Specodex" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance: Preconnect to API domain (if different from app domain) -->
    <!-- <link rel="preconnect" href="https://your-api-domain.com" crossorigin> -->

    <!-- Performance: DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Monospace font for data values; Oswald for Specodex landing headlines -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <title>Specodex — Cross-vendor industrial spec database</title>
